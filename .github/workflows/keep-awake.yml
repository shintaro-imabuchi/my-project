name: Keep Streamlit Apps Awake

on:
  schedule:
    - cron: '0 1 * * *'   # UTC  1:00 (JST 10:00)
    - cron: '0 9 * * *'   # UTC  9:00 (JST 18:00)
    - cron: '0 17 * * *'  # UTC 17:00 (JST 翌 2:00)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Keep staff app awake
        env:
          APP_STAFF_URL: ${{ secrets.APP_STAFF_URL }}
        run: python agility-compe-app/scripts/auto_login_staff.py

      - name: Keep entry app awake
        env:
          APP_ENTRY_URL: ${{ secrets.APP_ENTRY_URL }}
        run: python agility-compe-app/scripts/auto_login_entry.py
